name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm run audit
        if: matrix.node == 22
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-typst
      - run: pnpm run verify:demo
      - run: pnpm test:integration
      - run: pnpm test:package
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - name: Verify PDF fonts and pages
        run: |
          set -euo pipefail
          pdf=examples/astro-blog/dist/glyphweave/posts/hnsw-search-notes/article.pdf
          pdfinfo "$pdf" | grep -E '^Pages:[[:space:]]+[1-9][0-9]*$'
          pdffonts "$pdf" > "$RUNNER_TEMP/pdf-fonts.txt"
          grep -Eq 'NotoSerifCJK|Noto Serif CJK' "$RUNNER_TEMP/pdf-fonts.txt"
          grep -Eq 'NotoSansCJK|Noto Sans CJK' "$RUNNER_TEMP/pdf-fonts.txt"
          grep -Eq 'DejaVuSansMono|DejaVu Sans Mono' "$RUNNER_TEMP/pdf-fonts.txt"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-traces
          path: test-results/
