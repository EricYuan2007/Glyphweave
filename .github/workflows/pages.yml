name: Pages

env:
  GITHUB_PAGES: 'true'

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-typst
      - run: pnpm check
      - run: pnpm test:integration
      - name: Build demo
        run: pnpm --filter example-astro-blog build
      - name: Verify generated PDF
        run: |
          pdf='examples/astro-blog/dist/glyphweave/posts/hnsw-search-notes/article.pdf'
          test -s "$pdf"
          pdfinfo "$pdf" | grep -E '^Pages:[[:space:]]+[1-9][0-9]*$'
          pdffonts "$pdf" | tee pdf-fonts.txt
          grep -Eq 'NotoSerifCJK|Noto Serif CJK' pdf-fonts.txt
          grep -Eq 'NotoSansCJK|Noto Sans CJK' pdf-fonts.txt
          grep -Eq 'DejaVuSansMono|DejaVu Sans Mono' pdf-fonts.txt
      - run: pnpm --filter example-astro-blog pagefind
      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples/astro-blog/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
