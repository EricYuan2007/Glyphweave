name: Bug report
description: Report a reproducible defect
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node, pnpm, Typst and Glyphweave revision
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps, a small Typst source and config; remove private data
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
