name: Setup Typst and PDF tools
description: Install the verified Linux compiler and reproducible PDF font families
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/typst.tar.xz"
        curl --fail --location --retry 3 https://github.com/typst/typst/releases/download/v0.15.0/typst-x86_64-unknown-linux-musl.tar.xz -o "$archive"
        echo "59b207df01be2dab9f13e80f73d04d7ff8273ffd46b3dd1b9eef5c60f3eeabea  $archive" | sha256sum --check
        tar -xf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
        sudo apt-get update
        sudo apt-get install --yes fonts-noto-cjk fonts-dejavu-core poppler-utils
